plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.clima"
    compileSdk 35

    defaultConfig {
        applicationId "com.example.clima"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            // 🔹 Mientras no tengas keystore propio, puedes usar el debug para probar
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    // 🔹 Java 17 + desugaring
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17

        // 👇 ESTO es lo que te pedía el error
        coreLibraryDesugaringEnabled true
    }

    // 🔹 Kotlin apuntando a JVM 17
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    // (otras dependencias que ya tengas van aquí si las hay)

    // 👇 Necesaria para el desugaring que pide flutter_local_notifications
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

// 👇 Normalmente Flutter agrega esto al final
flutter {
    source "../.."
}
